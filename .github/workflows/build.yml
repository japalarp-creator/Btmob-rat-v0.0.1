name: Repository checks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          test -s gradle/wrapper/gradle-wrapper.properties
          echo "Repository layout checks passed. APK building is disabled."
