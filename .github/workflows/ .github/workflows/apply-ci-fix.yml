name: Apply CI fix (add gradlew + update build workflow)

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create working branch
        run: |
          BRANCH=ci/auto-fix-$(date +%Y%m%d%H%M%S)
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git checkout -b "$BRANCH"

      - name: Add Unix gradlew launcher
        run: |
          cat > gradlew <<'EOF'
          #!/usr/bin/env sh
          APP_HOME=$(cd "$(dirname "$0")" && pwd)
          APP_BASE_NAME=${0##*/}
          if [ -n "$JAVA_HOME" ] ; then
            if [ -x "$JAVA_HOME/jre/sh/java" ] ; then
              JAVACMD="$JAVA_HOME/jre/sh/java"
            else
              JAVACMD="$JAVA_HOME/bin/java"
            fi
          else
            JAVACMD="java"
          fi
          if [ ! -x "$JAVACMD" ] ; then
            echo "ERROR: JAVA_HOME is not set and no 'java' command could be found in your PATH." >&2
            exit 1
          fi
          DEFAULT_JVM_OPTS='\"-Xmx64m\" \"-Xms64m\"'
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec "$JAVACMD" $DEFAULT_JVM_OPTS $JAVA_OPTS $GRADLE_OPTS \
            "-Dorg.gradle.appname=$APP_BASE_NAME" \
            -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Update build workflow to use wrapper + install Android SDK
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/build.yml <<'EOF'
          name: Build Android APK

          on:
            push:
              branches: ["main"]
            workflow_dispatch:

          jobs:
            build:
              runs-on: ubuntu-latest

              steps:
                - name: Checkout do código
                  uses: actions/checkout@v4

                - name: Configurar JDK 17
                  uses: actions/setup-java@v4
                  with:
                    java-version: '17'
                    distribution: 'temurin'

                - name: Setup Android SDK
                  uses: android-actions/setup-android@v3

                - name: Install required SDK packages
                  env:
                    ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
                  run: |
                    yes | sdkmanager --licenses
                    sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

                - name: Ensure Gradle wrapper is executable
                  run: chmod +x ./gradlew

                - name: Compilar o APK (Debug)
                  env:
                    ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
                  run: bash ./gradlew assembleDebug --no-daemon --stacktrace

                - name: Fazer Upload do APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: rat-apk
                    path: app/build/outputs/apk/debug/app-debug.apk
          EOF

      - name: Commit changes
        run: |
          git add gradlew .github/workflows/build.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: add gradlew and update workflow to use wrapper + install Android SDK"
            git push --set-upstream origin "$BRANCH"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci: add gradlew and update workflow to use wrapper + install Android SDK"
          branch: ${{ env.BRANCH }}
          title: "ci: fix Android build — use Gradle wrapper and install SDK"
          body: |
            This PR adds the missing Unix Gradle wrapper launcher and updates the CI workflow
            so the runner installs required Android SDK packages and runs ./gradlew assembleDebug.
          labels: ci, automation
